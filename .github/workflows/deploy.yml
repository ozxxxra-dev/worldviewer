name: Update data & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *' # 毎時7分にデータ更新
  workflow_dispatch:

permissions:
  contents: write # 金価格の履歴ファイルをコミットするため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run fetch
      - name: Update gold price history
        run: node scripts/update-gold.mjs
      - name: Commit gold price history
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- public/data/gold-history.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add public/data/gold-history.json
          git commit -m 'data: 金価格の履歴を更新'
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
